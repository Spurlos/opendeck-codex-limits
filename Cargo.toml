[package]
name = "opendeck-codex-limits"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
openaction = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
futures-util = "0.3"
tempfile = "3"
tokio-tungstenite = "0.28"
